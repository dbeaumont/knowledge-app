spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - TokenRelay
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 10000       # en ms
        response-timeout: 600s      # durée max d’attente de la réponse      
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:https://keycloak.local:8443/realms/knowledge}
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:gateway-bff}
            client-secret: ${OIDC_CLIENT_SECRET:gateway-bff-secret}
            authorization-grant-type: authorization_code
            redirect-uri: ${OIDC_REDIRECT_URI:http://localhost:4200/login/oauth2/code/keycloak}
            scope: openid,profile,email
  codec:
    max-in-memory-size: ${GATEWAY_MAX_IN_MEMORY_SIZE:20MB}

services:
  rag:
    uri: http://rag-service:8080
  document:
    uri: http://document-service:8080
  user:
    uri: http://user-service:8080

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
