spring:
  application:
    name: user-service
  jackson:
    serialization:
      indent_output: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://keycloak.local:8443/realms/knowledge}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
