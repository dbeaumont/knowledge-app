spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:knowledge}
    username: ${POSTGRES_USER:knowledge}
    password: ${POSTGRES_PASSWORD:knowledge}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
  jackson:
    serialization:
      indent_output: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:https://keycloak.local:8443/realms/knowledge}
        registration:
          rag-ingestor:
            client-id: ${OIDC_RAG_CLIENT_ID:document-service}
            client-secret: ${OIDC_RAG_CLIENT_SECRET:document-service-secret}
            authorization-grant-type: client_credentials
            provider: keycloak
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://keycloak.local:8443/realms/knowledge}
  servlet:
    multipart:
      max-file-size: ${DOC_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOC_MAX_REQUEST_SIZE:20MB}

server:
  port: 8080

ingestion:
  oauth2:
    registration-id: rag-ingestor

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
