spring:
  application:
    name: rag-service
  jackson:
    serialization:
      indent_output: true
  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:qdrant}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:knowledge-base}
        api-key: ${QDRANT_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:local}
      base-url: ${OPENAI_BASE_URL:http://host.docker.internal:12434}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen2.5}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:${OPENAI_MODEL:qwen2.5}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://keycloak.local:8443/realms/knowledge}

rag:
  ingest:
    chunk-size: ${RAG_INGEST_CHUNK_SIZE:256}
    min-chars: ${RAG_INGEST_MIN_CHARS:200}
    min-chunk-length: ${RAG_INGEST_MIN_CHUNK_LENGTH:5}
    max-chunks: ${RAG_INGEST_MAX_CHUNKS:1000}
    keep-separator: ${RAG_INGEST_KEEP_SEPARATOR:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
