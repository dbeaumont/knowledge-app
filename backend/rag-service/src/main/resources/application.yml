spring:
  application:
    name: rag-service
  jackson:
    serialization:
      indent_output: true
  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:qdrant}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:knowledge-base}
        api-key: ${QDRANT_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.1:8b}
        options:
          temperature: 0.2
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:${OLLAMA_MODEL:llama3.1:8b}}

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
