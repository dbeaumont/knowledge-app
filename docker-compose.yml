services:
  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    image: ai-knowledge/gateway:latest
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SERVICES_RAG_URI=http://rag-service:8080
      - SERVICES_DOCUMENT_URI=http://document-service:8080
      - SERVICES_USER_URI=http://user-service:8080
    secrets:
      - jwt_secret
    ports:
      - "8080:8080"
    profiles: [dev, prod]
    depends_on:
      rag-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  rag-service:
    build:
      context: ./backend
      dockerfile: ./rag-service/Dockerfile
    image: ai-knowledge/rag-service:latest
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:12434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-local}
      - OPENAI_MODEL=ai/qwen2.5:latest
      - OPENAI_EMBEDDING_MODEL=ai/mxbai-embed-large:latest
      - RAG_INGEST_CHUNK_SIZE=${RAG_INGEST_CHUNK_SIZE:-256}
      - RAG_INGEST_MIN_CHARS=${RAG_INGEST_MIN_CHARS:-200}
      - RAG_INGEST_MIN_CHUNK_LENGTH=${RAG_INGEST_MIN_CHUNK_LENGTH:-5}
      - RAG_INGEST_MAX_CHUNKS=${RAG_INGEST_MAX_CHUNKS:-1000}
      - RAG_INGEST_KEEP_SEPARATOR=${RAG_INGEST_KEEP_SEPARATOR:-true}
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]
    models:
      - qwen2_5
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  document-service:
    build:
      context: ./backend
      dockerfile: ./document-service/Dockerfile
    image: ai-knowledge/document-service:latest
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=knowledge
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    image: ai-knowledge/user-service:latest
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    image: ai-knowledge/frontend:latest
    ports:
      - "4200:80"
    profiles: [dev, prod]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - POSTGRES_DB=knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles: [dev, prod]
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: [dev, prod]
    networks:
      - knowledge-net
# Pas trouvé de technique viable pour un healthcheck sur qdrant...
#    healthcheck:
#      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm 2>/dev/null)\" = \"qdrant\" ]"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 15s

  toolbox:
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    profiles: [dev]
    networks:
      - knowledge-net

models:
  qwen2_5:
    model: qwen2.5

volumes:
  pgdata:
  qdrant-data:

networks:
  knowledge-net:
    driver: bridge

secrets:
  jwt_secret:
    file: ./backend/secrets/jwt_secret
