services:
  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    image: ai-knowledge/gateway:latest
    networks:
      - knowledge-net
    depends_on:
      - rag-service
      - document-service
      - user-service
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SERVICES_RAG_URI=http://rag-service:8080
      - SERVICES_DOCUMENT_URI=http://document-service:8080
      - SERVICES_USER_URI=http://user-service:8080
    secrets:
      - jwt_secret
    ports:
      - "8080:8080"
    profiles: [dev, prod]

  rag-service:
    build:
      context: ./backend
      dockerfile: ./rag-service/Dockerfile
    image: ai-knowledge/rag-service:latest
    networks:
      - knowledge-net
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    depends_on:
      - qdrant
      - ollama
    profiles: [dev, prod, gpu]

  document-service:
    build:
      context: ./backend
      dockerfile: ./document-service/Dockerfile
    image: ai-knowledge/document-service:latest
    networks:
      - knowledge-net
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=knowledge
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    depends_on:
      - postgres
    profiles: [dev, prod]

  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    image: ai-knowledge/user-service:latest
    networks:
      - knowledge-net
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    image: ai-knowledge/frontend:latest
    depends_on:
      - gateway
    ports:
      - "4200:80"
    networks:
      - knowledge-net
    profiles: [dev, prod]

  postgres:
    image: postgres:16-alpine
    networks:
      - knowledge-net
    environment:
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - POSTGRES_DB=knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles: [dev, prod]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - knowledge-net
    profiles: [dev, prod, gpu]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - knowledge-net
    profiles: [dev, gpu]

  toolbox:
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    networks:
      - knowledge-net
    profiles: [dev]

volumes:
  pgdata:
  qdrant-data:
  ollama:

networks:
  knowledge-net:
    driver: bridge

secrets:
  jwt_secret:
    file: ./backend/secrets/jwt_secret
