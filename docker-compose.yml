services:
  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    image: ai-knowledge/gateway:latest
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SERVICES_RAG_URI=http://rag-service:8080
      - SERVICES_DOCUMENT_URI=http://document-service:8080
      - SERVICES_USER_URI=http://user-service:8080
    secrets:
      - jwt_secret
    ports:
      - "8080:8080"
    profiles: [dev, prod]
    depends_on:
      rag-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  rag-service:
    build:
      context: ./backend
      dockerfile: ./rag-service/Dockerfile
    image: ai-knowledge/rag-service:latest
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - OLLAMA_EMBEDDING_MODEL=llama3.1:8b
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod, gpu]
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  document-service:
    build:
      context: ./backend
      dockerfile: ./document-service/Dockerfile
    image: ai-knowledge/document-service:latest
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=knowledge
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    image: ai-knowledge/user-service:latest
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    profiles: [dev, prod]
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    image: ai-knowledge/frontend:latest
    ports:
      - "4200:80"
    profiles: [dev, prod]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=knowledge
      - POSTGRES_PASSWORD=knowledge
      - POSTGRES_DB=knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles: [dev, prod]
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: [dev, prod, gpu]
    networks:
      - knowledge-net
# Pas trouvé de technique viable pour un healthcheck sur qdrant...
#    healthcheck:
#      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm 2>/dev/null)\" = \"qdrant\" ]"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 15s

  # L’image ollama/ollama:latest ne contient aucun modèle par défaut. 
  # Il faut en tirer un après lancement (ex. docker compose run --rm ollama ollama pull llama3.1:8b). 
  # Le volume ollama:/root/.ollama conserve les modèles téléchargés entre les redémarrages.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./.ollama:/root/.ollama
    ports:
      - "11434:11434"
    profiles: [dev, gpu]
    networks:
      - knowledge-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  toolbox:
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    profiles: [dev]
    networks:
      - knowledge-net

volumes:
  pgdata:
  qdrant-data:

networks:
  knowledge-net:
    driver: bridge

secrets:
  jwt_secret:
    file: ./backend/secrets/jwt_secret
